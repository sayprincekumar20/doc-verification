[project]
name = "doc-verification"
version = "0.1.0"
description = "Customer document verification engine (FastAPI) for Zoho CRM"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "boto3>=1.34",
  "filetype>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
monitoring = ["sentry-sdk[fastapi,celery]>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the intended pattern

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
